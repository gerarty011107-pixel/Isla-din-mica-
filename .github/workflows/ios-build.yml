name: iOS Build Check - V4 WidgetKit + Scarlet

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project DynamicIsland11/DynamicIsland11.xcodeproj

      - name: Build unsigned app and WidgetKit extension
        run: |
          set -o pipefail
          rm -rf build
          xcodebuild \
            -project DynamicIsland11/DynamicIsland11.xcodeproj \
            -scheme DynamicIsland11 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build | tee xcodebuild.log

      - name: Verify app and Live Activity extension
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/DynamicIsland11.app"
          EXT_PATH="$APP_PATH/PlugIns/DynamicIslandLiveActivity.appex"

          test -d "$APP_PATH"
          test -d "$EXT_PATH"
          test -f "$APP_PATH/Info.plist"
          test -f "$EXT_PATH/Info.plist"
          test ! -e "$APP_PATH/embedded.mobileprovision"
          test ! -e "$EXT_PATH/embedded.mobileprovision"

          echo "App:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          echo "Extension:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$EXT_PATH/Info.plist"

      - name: Package unsigned IPA for Scarlet
        run: |
          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/DynamicIsland11.app"
          rm -rf Payload DynamicIsland11-v4-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DynamicIsland11.app
          /usr/bin/zip -qry DynamicIsland11-v4-unsigned.ipa Payload
          unzip -l DynamicIsland11-v4-unsigned.ipa | grep -E 'DynamicIsland11.app/PlugIns/DynamicIslandLiveActivity.appex|DynamicIsland11.app/Info.plist'
          test -s DynamicIsland11-v4-unsigned.ipa

      - name: Upload V4 unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: DynamicIsland11-v4-unsigned-ipa
          path: DynamicIsland11-v4-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DynamicIsland11-v3-xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
