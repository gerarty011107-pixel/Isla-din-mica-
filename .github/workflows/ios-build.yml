name: iOS Build Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project DynamicIsland11/DynamicIsland11.xcodeproj

      - name: Build for iPhoneOS (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DynamicIsland11/DynamicIsland11.xcodeproj \
            -scheme DynamicIsland11 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild.log

      - name: Locate built app
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Release-iphoneos/DynamicIsland11.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo 'DynamicIsland11.app was not produced.'
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          rm -rf Payload DynamicIsland11-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DynamicIsland11.app
          /usr/bin/zip -qry DynamicIsland11-unsigned.ipa Payload
          test -s DynamicIsland11-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: DynamicIsland11-unsigned-ipa
          path: DynamicIsland11-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: DynamicIsland11-xcode-build-log
          path: xcodebuild.log
          if-no-files-found: ignore
